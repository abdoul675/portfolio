name: Publier le portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v6
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer les fichiers publics
        run: |
          mkdir _site
          cp index.html style.css script.js _site/
          cp -r assets _site/
          touch _site/.nojekyll
      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
